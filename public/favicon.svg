<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e162c" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Rounded Icon Base -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="12" />
  
  <!-- Subtle Internal Glow Grid Overlay -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.35" stroke-dasharray="8 8" />

  <!-- Premium Futuristic "A" Emblem for Ashadullah -->
  <g filter="url(#neonGlow)">
    <!-- Outer A Shape -->
    <path d="M 256 90 L 110 395 L 178 395 L 256 225 L 334 395 L 402 395 Z" fill="url(#glowGrad)" />
    
    <!-- Central Modern Crossbar Bar -->
    <path d="M 188 300 L 324 300 L 308 260 L 204 260 Z" fill="url(#accentGrad)" />
    
    <!-- Apex Futuristic Diamond Core -->
    <polygon points="256,125 278,175 234,175" fill="#ffffff" opacity="0.95" />

    <!-- Core Glowing Sparkle Node -->
    <circle cx="256" cy="280" r="14" fill="#38bdf8" />
  </g>
</svg>
